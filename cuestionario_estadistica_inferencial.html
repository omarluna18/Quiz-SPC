<head>
    <meta charset="UTF-8">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #1a1a3e, #2d2b55);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            max-width: 850px;
            width: 100%;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            padding: 35px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            text-align: center;
            color: #f5f0f0;
            margin-bottom: 8px;
            font-size: 1.9em;
            letter-spacing: 1px;
        }

        .subtitulo {
            text-align: center;
            color: #b0aaff;
            margin-bottom: 30px;
            font-size: 0.95em;
            font-weight: 300;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: inline-block;
            width: auto;
            margin-left: auto;
            margin-right: auto;
            padding-bottom: 12px;
        }

        .progreso {
            text-align: center;
            margin-bottom: 15px;
            font-size: 1.05em;
            color: #c0c0e0;
            font-weight: 500;
        }

        .barra-progreso {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .barra-progreso-interna {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #a855f7);
            border-radius: 3px;
            transition: width 0.5s ease;
            width: 8.33%;
        }

        .pregunta-container {
            display: none;
            animation: fadeSlideIn 0.45s ease;
        }

        .pregunta-container.activa {
            display: block;
        }

        @keyframes fadeSlideIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .numero-pregunta {
            color: #a855f7;
            font-weight: 700;
            font-size: 0.9em;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .texto-pregunta {
            background: rgba(102, 126, 234, 0.08);
            border-left: 5px solid #a855f7;
            padding: 20px 24px;
            border-radius: 14px;
            margin-bottom: 28px;
            font-size: 1.12em;
            line-height: 1.6;
            color: #e8e8f0;
        }

        .texto-pregunta .math {
            color: #ffd966;
            font-size: 1.05em;
        }

        .opciones {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .opcion {
            background: rgba(255, 255, 255, 0.04);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 14px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 16px;
            color: #d0d0e8;
        }

        .opcion:hover {
            background: rgba(102, 126, 234, 0.12);
            border-color: rgba(102, 126, 234, 0.5);
            transform: translateX(6px);
        }

        .opcion.seleccionada {
            background: rgba(102, 126, 234, 0.25);
            border-color: #667eea;
            box-shadow: 0 0 18px rgba(102, 126, 234, 0.2);
        }

        .opcion.correcta {
            background: rgba(46, 204, 113, 0.2) !important;
            border-color: #2ecc71 !important;
        }

        .opcion.incorrecta {
            background: rgba(231, 76, 60, 0.2) !important;
            border-color: #e74c3c !important;
        }

        .letra-opcion {
            background: rgba(102, 126, 234, 0.25);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.15em;
            flex-shrink: 0;
            color: #c0c0f0;
        }

        .texto-opcion {
            flex: 1;
            font-size: 1em;
            line-height: 1.45;
        }

        .explicacion {
            display: none;
            margin-top: 25px;
            padding: 18px 22px;
            background: rgba(255, 200, 50, 0.06);
            border-left: 4px solid #ffb347;
            border-radius: 12px;
            line-height: 1.6;
            color: #e0d8b0;
        }

        .explicacion .math {
            color: #ffb347;
        }

        .explicacion.visible {
            display: block;
            animation: fadeSlideIn 0.35s ease;
        }

        .botones {
            display: flex;
            justify-content: space-between;
            margin-top: 35px;
            flex-wrap: wrap;
            gap: 12px;
        }

        button {
            padding: 12px 28px;
            border: none;
            border-radius: 30px;
            font-size: 0.95em;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .btn-anterior {
            background: rgba(255, 255, 255, 0.06);
            color: #d0d0e0;
            border: 2px solid rgba(255, 255, 255, 0.15);
        }

        .btn-anterior:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateX(-3px);
        }

        .btn-siguiente {
            background: linear-gradient(135deg, #667eea, #a855f7);
            color: white;
        }

        .btn-siguiente:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(102, 126, 234, 0.4);
        }

        .btn-reiniciar {
            background: transparent;
            color: #ffb347;
            border: 2px solid #ffb347;
        }

        .btn-reiniciar:hover {
            background: rgba(255, 180, 71, 0.08);
            transform: scale(1.02);
        }

        .resultado-container {
            display: none;
            text-align: center;
            padding: 25px;
        }

        .resultado-container.visible {
            display: block;
            animation: fadeSlideIn 0.55s ease;
        }

        .puntaje {
            font-size: 4.8em;
            font-weight: 800;
            color: #ffb347;
            margin: 25px 0;
            text-shadow: 2px 2px 15px rgba(0,0,0,0.4);
        }

        .mensaje-final {
            font-size: 1.15em;
            margin-bottom: 35px;
            line-height: 1.7;
            color: #d0d0e8;
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }

        @media (max-width: 600px) {
            .container {
                padding: 22px 15px;
                border-radius: 20px;
            }
            h1 {
                font-size: 1.4em;
            }
            .texto-pregunta {
                font-size: 1em;
                padding: 15px 18px;
            }
            .opcion {
                padding: 10px 14px;
                gap: 10px;
            }
            .letra-opcion {
                width: 32px;
                height: 32px;
                font-size: 1em;
            }
            button {
                padding: 10px 18px;
                font-size: 0.85em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Estadística Inferencial</h1>
        <div style="text-align: center;">
            <span class="subtitulo">Estimación · Propiedades · Intervalos · Hipótesis</span>
        </div>
        
        <div id="zona-cuestionario">
            <div class="progreso" id="texto-progreso">Pregunta 1 de 12</div>
            <div class="barra-progreso">
                <div class="barra-progreso-interna" id="barra-progreso" style="width: 8.33%;"></div>
            </div>
            <div id="contenedor-preguntas"></div>
            <div class="botones" id="botones-navegacion">
                <button class="btn-anterior" id="btn-anterior" onclick="preguntaAnterior()">◀ Anterior</button>
                <button class="btn-reiniciar" onclick="reiniciarCuestionario()">🔄 Reiniciar</button>
                <button class="btn-siguiente" id="btn-siguiente" onclick="preguntaSiguiente()">Siguiente ▶</button>
            </div>
        </div>
        
        <div class="resultado-container" id="resultado-container">
            <h2 style="color: #f0f0f0; margin-bottom: 15px;">🎉 ¡Cuestionario Finalizado!</h2>
            <div class="puntaje" id="puntaje-final">0/12</div>
            <p class="mensaje-final" id="mensaje-final"></p>
            <button class="btn-reiniciar" onclick="reiniciarCuestionario()">🔄 Volver a Intentar</button>
        </div>
    </div>

    <script>
        const preguntas = [{"id": 1, "pregunta": "En el contexto de la estimación puntual, ¿cuál es la diferencia fundamental entre un 'estimador' y una 'estimación'?", "opciones": {"a": "Un estimador es un número, mientras que una estimación es una variable aleatoria.", "b": "Un estimador $\\hat{\\theta}$ es una función de la muestra aleatoria (variable aleatoria), mientras que una estimación es el valor numérico obtenido al evaluar el estimador en una muestra específica.", "c": "Son sinónimos y se usan indistintamente.", "d": "La estimación es la función de densidad, y el estimador es el parámetro."}, "respuesta_correcta": "b", "explicacion": "Un estimador $\\hat{\\theta}(X_1,...,X_n)$ es una estadística (función de la muestra aleatoria). Una estimación es el valor numérico $\\hat{\\theta}(x_1,...,x_n)$ que se obtiene al aplicar el estimador a los datos observados."}, {"id": 2, "pregunta": "Sea $X_1, X_2, ..., X_n$ una muestra aleatoria de una distribución $\\text{Ber}(\\theta)$. ¿Cuál es el estimador de $\\theta$ por el **método de momentos**?", "opciones": {"a": "$\\hat{\\theta} = \\frac{1}{1+\\bar{X}}$", "b": "$\\hat{\\theta} = \\bar{X}^2$", "c": "$\\hat{\\theta} = \\bar{X}$", "d": "$\\hat{\\theta} = \\frac{1}{\\bar{X}}$"}, "respuesta_correcta": "c", "explicacion": "Para una distribución Bernoulli, $E[X] = \\theta$. Igualando con el primer momento muestral $\\bar{X} = \\frac{1}{n}\\sum X_i$, se obtiene $\\hat{\\theta} = \\bar{X}$."}, {"id": 3, "pregunta": "El método de máxima verosimilitud (MLE) consiste en:", "opciones": {"a": "Igualar los momentos poblacionales con los momentos muestrales y despejar $\\theta$.", "b": "Encontrar el valor de $\\theta$ que minimiza la varianza del estimador.", "c": "Encontrar el valor de $\\theta$ que maximiza la función de verosimilitud $L(\\theta) = \\prod_{i=1}^n f(x_i; \\theta)$.", "d": "Encontrar el valor de $\\theta$ que hace que el sesgo sea cero."}, "respuesta_correcta": "c", "explicacion": "El MLE busca el parámetro que hace más probable haber observado la muestra, maximizando la función de verosimilitud $L(\\theta)$ (o su logaritmo $\\ell(\\theta) = \\ln L(\\theta)$)."}, {"id": 4, "pregunta": "Para una muestra aleatoria de una distribución $\\text{Exp}(\\theta)$ con $\\theta > 0$, ¿cuál es el estimador de máxima verosimilitud (MLE) de $\\theta$?", "opciones": {"a": "$\\hat{\\theta} = \\bar{X}$", "b": "$\\hat{\\theta} = \\frac{1}{\\bar{X}}$", "c": "$\\hat{\\theta} = \\frac{n-1}{n} \\cdot \\frac{1}{\\bar{X}}$", "d": "$\\hat{\\theta} = \\frac{n}{n-1} \\bar{X}$"}, "respuesta_correcta": "b", "explicacion": "Para $\\text{Exp}(\\theta)$, $f(x;\\theta) = \\theta e^{-\\theta x}$. La función de verosimilitud es $L(\\theta) = \\theta^n e^{-\\theta n \\bar{x}}$. Maximizando, se obtiene $\\hat{\\theta}_{MV} = 1/\\bar{X}$."}, {"id": 5, "pregunta": "Un estimador $\\hat{\\theta}$ es **insesgado** para $\\theta$ si:", "opciones": {"a": "$\\text{Var}(\\hat{\\theta}) = 0$", "b": "$\\lim_{n\\to\\infty} E[\\hat{\\theta}] = \\theta$", "c": "$E[\\hat{\\theta}] = \\theta$", "d": "$E[\\hat{\\theta}^2] = \\theta^2$"}, "respuesta_correcta": "c", "explicacion": "La insesgadez (o sesgo nulo) significa que el valor esperado del estimador es igual al parámetro que se desea estimar: $E[\\hat{\\theta}] = \\theta$. El sesgo es $B(\\hat{\\theta}) = E[\\hat{\\theta}] - \\theta$."}, {"id": 6, "pregunta": "Sea $X_1, ..., X_n$ una muestra aleatoria de una distribución con media $\\theta$ y varianza $\\sigma^2$. ¿Cuál de los siguientes estimadores para $\\theta$ es **insesgado**?", "opciones": {"a": "$\\hat{\\theta} = X_1$", "b": "$\\hat{\\theta} = \\bar{X} = \\frac{1}{n}\\sum_{i=1}^n X_i$", "c": "$\\hat{\\theta} = \\frac{X_1 + X_n}{2}$", "d": "Todas las anteriores"}, "respuesta_correcta": "d", "explicacion": "Todos son insesgados porque $E[X_1] = \\theta$, $E[\\bar{X}] = \\theta$ y $E[(X_1+X_n)/2] = (\\theta+\\theta)/2 = \\theta$. La diferencia está en sus varianzas."}, {"id": 7, "pregunta": "El **Error Cuadrático Medio (MSE)** de un estimador $\\hat{\\theta}$ se define como $\\text{MSE}(\\hat{\\theta}) = E[(\\hat{\\theta} - \\theta)^2]$. ¿Cuál es su descomposición en términos de la varianza y el sesgo?", "opciones": {"a": "$\\text{MSE}(\\hat{\\theta}) = \\text{Var}(\\hat{\\theta}) - [B(\\hat{\\theta})]^2$", "b": "$\\text{MSE}(\\hat{\\theta}) = \\text{Var}(\\hat{\\theta}) + [B(\\hat{\\theta})]^2$", "c": "$\\text{MSE}(\\hat{\\theta}) = \\text{Var}(\\hat{\\theta})$", "d": "$\\text{MSE}(\\hat{\\theta}) = [B(\\hat{\\theta})]^2$"}, "respuesta_correcta": "b", "explicacion": "La descomposición clave es $\\text{MSE}(\\hat{\\theta}) = \\text{Var}(\\hat{\\theta}) + [B(\\hat{\\theta})]^2$, donde $B(\\hat{\\theta}) = E[\\hat{\\theta}] - \\theta$ es el sesgo."}, {"id": 8, "pregunta": "La **Cota Inferior de Cramér-Rao (CRLB)** establece un límite inferior para:", "opciones": {"a": "El sesgo de cualquier estimador.", "b": "La varianza de cualquier estimador insesgado.", "c": "El error cuadrático medio de cualquier estimador.", "d": "La media de cualquier estimador insesgado."}, "respuesta_correcta": "b", "explicacion": "La CRLB proporciona un límite inferior para la varianza de cualquier estimador insesgado: $\\text{Var}(\\hat{\\theta}) \\geq 1 / [n I(\\theta)]$, donde $I(\\theta)$ es la información de Fisher."}, {"id": 9, "pregunta": "¿Cuál es la expresión de la **Información de Fisher** $I(\\theta)$ para una variable aleatoria $X$?", "opciones": {"a": "$I(\\theta) = E\\left[\\left(\\frac{\\partial}{\\partial\\theta} \\ln f(X;\\theta)\\right)^2\\right]$", "b": "$I(\\theta) = \\text{Var}\\left(\\frac{\\partial}{\\partial\\theta} \\ln f(X;\\theta)\\right)$", "c": "$I(\\theta) = -E\\left[\\frac{\\partial^2}{\\partial\\theta^2} \\ln f(X;\\theta)\\right]$", "d": "Todas las anteriores son correctas bajo condiciones de regularidad."}, "respuesta_correcta": "d", "explicacion": "Bajo condiciones de regularidad, las tres expresiones son equivalentes. La más común es $I(\\theta) = E[(\\partial_\\theta \\ln f)^2]$, y también $I(\\theta) = -E[\\partial_\\theta^2 \\ln f]$."}, {"id": 10, "pregunta": "El **Teorema de Rao-Blackwell** establece que si $U$ es una estadística suficiente y $T$ es un estimador insesgado, entonces:", "opciones": {"a": "$E[T|U]$ tiene mayor varianza que $T$.", "b": "$E[T|U]$ es también un estimador insesgado y $\\text{Var}(E[T|U]) \\leq \\text{Var}(T)$.", "c": "$E[T|U]$ es siempre el estimador de máxima verosimilitud.", "d": "$E[T|U]$ es sesgado para el parámetro."}, "respuesta_correcta": "b", "explicacion": "Rao-Blackwell permite 'mejorar' un estimador insesgado condicionándolo a una estadística suficiente. El nuevo estimador $E[T|U]$ es insesgado y tiene varianza menor o igual."}, {"id": 11, "pregunta": "Para una muestra aleatoria de una distribución $\\text{N}(\\mu, \\sigma^2)$ con $\\sigma^2$ conocida, un intervalo de confianza al $95\\%$ para la media $\\mu$ es:", "opciones": {"a": "$\\bar{X} \\pm t_{0.025, n-1} \\cdot \\frac{S}{\\sqrt{n}}$", "b": "$\\bar{X} \\pm z_{0.025} \\cdot \\frac{\\sigma}{\\sqrt{n}}$", "c": "$\\bar{X} \\pm z_{0.05} \\cdot \\frac{\\sigma}{\\sqrt{n}}$", "d": "$\\frac{(n-1)S^2}{\\chi^2_{0.025}} \\leq \\sigma^2 \\leq \\frac{(n-1)S^2}{\\chi^2_{0.975}}$"}, "respuesta_correcta": "b", "explicacion": "Cuando $\\sigma^2$ es conocida, el pivote $\\frac{\\bar{X}-\\mu}{\\sigma/\\sqrt{n}} \\sim N(0,1)$. El IC al $95\\%$ es $\\bar{X} \\pm z_{0.025} \\cdot \\frac{\\sigma}{\\sqrt{n}}$, donde $z_{0.025} \\approx 1.96$."}, {"id": 12, "pregunta": "En una prueba de hipótesis, el **error tipo I** ($\\alpha$) se define como la probabilidad de:", "opciones": {"a": "No rechazar $H_0$ cuando $H_0$ es falsa.", "b": "Rechazar $H_0$ cuando $H_0$ es verdadera.", "c": "Rechazar $H_0$ cuando $H_0$ es falsa (potencia).", "d": "No rechazar $H_0$ cuando $H_0$ es verdadera."}, "respuesta_correcta": "b", "explicacion": "El error Tipo I ($\\alpha$) es rechazar la hipótesis nula siendo esta verdadera. El error Tipo II ($\\beta$) es no rechazar $H_0$ siendo falsa. La potencia es $1-\\beta$."}];
        let preguntaActual = 0;
        let respuestas = new Array(preguntas.length).fill(null);
        let cuestionarioFinalizado = false;

        function inicializarCuestionario() {
            const contenedor = document.getElementById('contenedor-preguntas');
            contenedor.innerHTML = '';
            
            preguntas.forEach((p, index) => {
                const div = document.createElement('div');
                div.className = 'pregunta-container';
                if (index === 0) div.classList.add('activa');
                div.id = 'pregunta-' + index;
                
                let opcionesHTML = '';
                const letras = ['a', 'b', 'c', 'd'];
                for (let letra of letras) {
                    opcionesHTML += `
                        <div class="opcion" id="opcion-${index}-${letra}" onclick="seleccionarRespuesta(${index}, '${letra}')">
                            <div class="letra-opcion">${letra.toUpperCase()}</div>
                            <div class="texto-opcion">${p.opciones[letra]}</div>
                        </div>
                    `;
                }
                
                div.innerHTML = `
                    <div class="numero-pregunta">📌 PREGUNTA ${p.id}</div>
                    <div class="texto-pregunta">${p.pregunta}</div>
                    <div class="opciones">
                        ${opcionesHTML}
                    </div>
                    <div class="explicacion" id="explicacion-${index}">
                        💡 <strong>Explicación:</strong> ${p.explicacion}
                    </div>
                `;
                
                contenedor.appendChild(div);
            });
            
            actualizarNavegacion();
        }

        function seleccionarRespuesta(index, letra) {
            if (cuestionarioFinalizado) return;
            if (respuestas[index] !== null) return;
            
            respuestas[index] = letra;
            const pregunta = preguntas[index];
            
            const letras = ['a', 'b', 'c', 'd'];
            letras.forEach(l => {
                const opcion = document.getElementById('opcion-' + index + '-' + l);
                if (opcion) {
                    opcion.style.pointerEvents = 'none';
                    if (l === pregunta.respuesta_correcta) {
                        opcion.classList.add('correcta');
                    }
                }
            });
            
            const opcionUsuario = document.getElementById('opcion-' + index + '-' + letra);
            if (opcionUsuario) {
                opcionUsuario.classList.add('seleccionada');
                if (letra !== pregunta.respuesta_correcta) {
                    opcionUsuario.classList.add('incorrecta');
                }
            }
            
            const explicacion = document.getElementById('explicacion-' + index);
            if (explicacion) {
                explicacion.classList.add('visible');
            }
        }

        function mostrarPregunta(index) {
            const contenedores = document.querySelectorAll('.pregunta-container');
            contenedores.forEach(p => p.classList.remove('activa'));
            const preguntaDiv = document.getElementById('pregunta-' + index);
            if (preguntaDiv) preguntaDiv.classList.add('activa');
            
            document.getElementById('texto-progreso').textContent = `Pregunta ${index + 1} de ${preguntas.length}`;
            const porcentaje = ((index + 1) / preguntas.length) * 100;
            document.getElementById('barra-progreso').style.width = porcentaje + '%';
            
            actualizarNavegacion();
            MathJax.typesetPromise && MathJax.typesetPromise();
        }

        function actualizarNavegacion() {
            const btnAnterior = document.getElementById('btn-anterior');
            const btnSiguiente = document.getElementById('btn-siguiente');
            
            btnAnterior.disabled = preguntaActual === 0;
            
            if (preguntaActual === preguntas.length - 1) {
                btnSiguiente.textContent = '✅ Finalizar';
            } else {
                btnSiguiente.textContent = 'Siguiente ▶';
            }
        }

        function preguntaSiguiente() {
            if (preguntaActual === preguntas.length - 1) {
                finalizarCuestionario();
                return;
            }
            
            if (preguntaActual < preguntas.length - 1) {
                preguntaActual++;
                mostrarPregunta(preguntaActual);
            }
        }

        function preguntaAnterior() {
            if (preguntaActual > 0) {
                preguntaActual--;
                mostrarPregunta(preguntaActual);
            }
        }

        function finalizarCuestionario() {
            let aciertos = 0;
            preguntas.forEach((p, index) => {
                if (respuestas[index] === p.respuesta_correcta) aciertos++;
            });
            
            cuestionarioFinalizado = true;
            document.getElementById('zona-cuestionario').style.display = 'none';
            const resultadoDiv = document.getElementById('resultado-container');
            resultadoDiv.classList.add('visible');
            document.getElementById('puntaje-final').textContent = aciertos + '/' + preguntas.length;
            
            const porcentaje = (aciertos / preguntas.length) * 100;
            const mensaje = document.getElementById('mensaje-final');
            
            if (porcentaje >= 90) {
                mensaje.innerHTML = '🌟 <strong>¡Excelente!</strong><br>Dominas los fundamentos de la estadística inferencial. ¡Felicidades!';
            } else if (porcentaje >= 70) {
                mensaje.innerHTML = '👍 <strong>¡Buen trabajo!</strong><br>Tienes una buena base. Revisa las preguntas que fallaste para consolidar conceptos.';
            } else if (porcentaje >= 50) {

            }
        }

        function reiniciarCuestionario() {
            preguntaActual = 0;
            respuestas = new Array(preguntas.length).fill(null);
            cuestionarioFinalizado = false;
            
            document.getElementById('zona-cuestionario').style.display = 'block';
            document.getElementById('resultado-container').classList.remove('visible');
            
            inicializarCuestionario();
            mostrarPregunta(0);
        }

        inicializarCuestionario();
        mostrarPregunta(0);
