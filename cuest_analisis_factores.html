<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuestionario - Análisis Factorial (Hair et al., págs. 89-92)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 25px;
            padding: 35px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        h1 {
            text-align: center;
            color: #f0f0f0;
            margin-bottom: 8px;
            font-size: 1.8em;
            letter-spacing: 1px;
        }

        .subtitulo {
            text-align: center;
            color: #a0a0c0;
            margin-bottom: 30px;
            font-size: 0.95em;
            font-weight: 300;
        }

        .progreso {
            text-align: center;
            margin-bottom: 15px;
            font-size: 1.05em;
            color: #c0c0e0;
            font-weight: 500;
        }

        .barra-progreso {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .barra-progreso-interna {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 3px;
            transition: width 0.5s ease;
        }

        .pregunta-container {
            display: none;
            animation: fadeSlideIn 0.45s ease;
        }

        .pregunta-container.activa {
            display: block;
        }

        @keyframes fadeSlideIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .numero-pregunta {
            color: #667eea;
            font-weight: 700;
            font-size: 1em;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .texto-pregunta {
            background: rgba(102, 126, 234, 0.08);
            border-left: 5px solid #667eea;
            padding: 18px 22px;
            border-radius: 10px;
            margin-bottom: 25px;
            font-size: 1.15em;
            line-height: 1.6;
            color: #e8e8f0;
        }

        .opciones {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .opcion {
            background: rgba(255, 255, 255, 0.04);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 14px 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 14px;
            color: #d0d0e0;
        }

        .opcion:hover {
            background: rgba(102, 126, 234, 0.12);
            border-color: rgba(102, 126, 234, 0.5);
            transform: translateX(6px);
        }

        .opcion.seleccionada {
            background: rgba(102, 126, 234, 0.2);
            border-color: #667eea;
            box-shadow: 0 0 18px rgba(102, 126, 234, 0.25);
        }

        .opcion.correcta {
            background: rgba(46, 204, 113, 0.25) !important;
            border-color: #2ecc71 !important;
            box-shadow: 0 0 18px rgba(46, 204, 113, 0.2) !important;
        }

        .opcion.incorrecta {
            background: rgba(231, 76, 60, 0.25) !important;
            border-color: #e74c3c !important;
            box-shadow: 0 0 18px rgba(231, 76, 60, 0.2) !important;
        }

        .letra-opcion {
            background: rgba(102, 126, 234, 0.25);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.1em;
            flex-shrink: 0;
            color: #c0c0f0;
        }

        .texto-opcion {
            flex: 1;
            font-size: 1.02em;
        }

        .explicacion {
            display: none;
            margin-top: 20px;
            padding: 16px 20px;
            background: rgba(255, 215, 0, 0.08);
            border-left: 4px solid #ffd700;
            border-radius: 8px;
            line-height: 1.6;
            color: #e0d8b0;
        }

        .explicacion.visible {
            display: block;
            animation: fadeSlideIn 0.35s ease;
        }

        .botones {
            display: flex;
            justify-content: space-between;
            margin-top: 35px;
            flex-wrap: wrap;
            gap: 10px;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            font-size: 0.95em;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .btn-anterior {
            background: rgba(255, 255, 255, 0.06);
            color: #d0d0e0;
            border: 2px solid rgba(255, 255, 255, 0.15);
        }

        .btn-anterior:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        .btn-siguiente {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .btn-siguiente:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(102, 126, 234, 0.4);
        }

        .btn-reiniciar {
            background: transparent;
            color: #ffd700;
            border: 2px solid #ffd700;
        }

        .btn-reiniciar:hover {
            background: rgba(255, 215, 0, 0.08);
        }

        .resultado-container {
            display: none;
            text-align: center;
            padding: 25px;
        }

        .resultado-container.visible {
            display: block;
            animation: fadeSlideIn 0.55s ease;
        }

        .puntaje {
            font-size: 4.5em;
            font-weight: 700;
            color: #ffd700;
            margin: 25px 0;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
        }

        .mensaje-final {
            font-size: 1.2em;
            margin-bottom: 30px;
            line-height: 1.7;
            color: #d0d0e0;
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            pointer-events: none;
        }

        @media (max-width: 600px) {
            .container {
                padding: 22px 15px;
                border-radius: 18px;
            }
            h1 {
                font-size: 1.35em;
            }
            .texto-pregunta {
                font-size: 1em;
                padding: 14px 16px;
            }
            button {
                padding: 10px 16px;
                font-size: 0.88em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Cuestionario de Análisis Factorial</h1>
        <p class="subtitulo">Basado en Hair, Anderson, Tatham, Black (5ª ed.) · págs. 89-92</p>

        <div id="zona-cuestionario">
            <div class="progreso" id="texto-progreso">Pregunta 1 de 15</div>
            <div class="barra-progreso">
                <div class="barra-progreso-interna" id="barra-progreso" style="width: 6.67%;"></div>
            </div>
            <div id="contenedor-preguntas"></div>
            <div class="botones" id="botones-navegacion">
                <button class="btn-anterior" id="btn-anterior" onclick="preguntaAnterior()">◀ Anterior</button>
                <button class="btn-reiniciar" onclick="reiniciarCuestionario()">🔄 Reiniciar</button>
                <button class="btn-siguiente" id="btn-siguiente" onclick="preguntaSiguiente()">Siguiente ▶</button>
            </div>
        </div>

        <div class="resultado-container" id="resultado-container">
            <h2 style="color: #f0f0f0;">🎉 ¡Cuestionario Completado!</h2>
            <div class="puntaje" id="puntaje-final">0/15</div>
            <p class="mensaje-final" id="mensaje-final"></p>
            <button class="btn-reiniciar" onclick="reiniciarCuestionario()">🔄 Volver a Intentar</button>
        </div>
    </div>

    <script>
        const preguntas = [
            {
                "id": 1,
                "pregunta": "Según el texto, ¿cuál es el tamaño muestral mínimo recomendado para aplicar análisis factorial?",
                "opciones": {
                    "a": "30 observaciones",
                    "b": "50 observaciones, preferiblemente 100 o más",
                    "c": "200 observaciones obligatorias",
                    "d": "10 veces el número de factores"
                },
                "respuesta_correcta": "b",
                "explicacion": "El texto indica que generalmente no se usa análisis factorial para muestras inferiores a 50 observaciones, y preferiblemente el tamaño muestral debería ser 100 o más grande."
            },
            {
                "id": 2,
                "pregunta": "¿Cuál es la regla general recomendada para el ratio casos/variable en análisis factorial?",
                "opciones": {
                    "a": "2 casos por cada variable",
                    "b": "5 veces el número de variables como mínimo, ideal 10:1",
                    "c": "20 casos por factor extraído",
                    "d": "50 casos independientemente de las variables"
                },
                "respuesta_correcta": "b",
                "explicacion": "El texto establece: 'el mínimo es tener por lo menos un número de observaciones cinco veces mayor que el número de variables a ser analizadas, siendo el tamaño aceptable un ratio de diez a uno'."
            },
            {
                "id": 3,
                "pregunta": "¿Qué problema se busca evitar al tener un alto ratio casos/variable en análisis factorial?",
                "opciones": {
                    "a": "La multicolinealidad",
                    "b": "La falta de normalidad",
                    "c": "El sobreajuste (factores específicos de la muestra con poca generalización)",
                    "d": "La heterocedasticidad"
                },
                "respuesta_correcta": "c",
                "explicacion": "El texto menciona que se debe minimizar 'las posibilidades de sobreajustar los datos (es decir, derivar los factores que son específicos a la muestra con poca capacidad de generalización)'."
            },
            {
                "id": 4,
                "pregunta": "¿Qué indica la prueba de esfericidad de Bartlett?",
                "opciones": {
                    "a": "Que las comunalidades son adecuadas",
                    "b": "La probabilidad estadística de que la matriz de correlación sea una matriz identidad",
                    "c": "El porcentaje de varianza explicada por los factores",
                    "d": "La fiabilidad de la escala de medición"
                },
                "respuesta_correcta": "b",
                "explicacion": "El texto dice: 'El contraste de esfericidad de Bartlett... proporciona la probabilidad estadística de que la matriz de correlación de las variables sea una matriz identidad'."
            },
            {
                "id": 5,
                "pregunta": "Un valor de la Medida de Adecuación Muestral (MSA) de 0.75 se clasifica como:",
                "opciones": {
                    "a": "Sobresaliente",
                    "b": "Regular (mediocre)",
                    "c": "Mediocre (deficiente)",
                    "d": "Aceptable"
                },
                "respuesta_correcta": "b",
                "explicacion": "Las directrices indican: 0.80 o superior = sobresaliente; 0.70 o superior = regular (mediocre). Por tanto, 0.75 se clasifica como 'regular'."
            },
            {
                "id": 6,
                "pregunta": "¿Qué valor de MSA se considera inaceptable y sugiere excluir la variable del análisis?",
                "opciones": {
                    "a": "0.65",
                    "b": "0.55",
                    "c": "0.45",
                    "d": "0.75"
                },
                "respuesta_correcta": "c",
                "explicacion": "El texto indica que por debajo de 0.50 es 'inaceptable' y que 'el investigador debería examinar primero los valores MSA para cada variable y excluir aquellos que caen en la gama de inaceptables'."
            },
            {
                "id": 7,
                "pregunta": "¿Cuál es la diferencia fundamental entre el análisis de componentes principales y el análisis factorial común?",
                "opciones": {
                    "a": "Uno usa variables métricas y el otro no métricas",
                    "b": "Componentes principales usa la varianza total, mientras que factor común usa solo la varianza compartida (común)",
                    "c": "Uno es para predicción y el otro solo para descripción",
                    "d": "No hay diferencia, son sinónimos"
                },
                "respuesta_correcta": "b",
                "explicacion": "El texto explica: 'El análisis de componentes principales considera la varianza total... Por el contrario, en el análisis factorial común se incorporan las varianzas compartidas en la diagonal'."
            },
            {
                "id": 8,
                "pregunta": "¿Cuándo es apropiado usar el análisis factorial común en lugar de componentes principales?",
                "opciones": {
                    "a": "Cuando el objetivo es predecir y maximizar la varianza explicada",
                    "b": "Cuando se busca identificar dimensiones latentes y eliminar varianza específica y de error",
                    "c": "Siempre, porque es el método más moderno",
                    "d": "Cuando el tamaño muestral es pequeño"
                },
                "respuesta_correcta": "b",
                "explicacion": "El texto indica: 'cuando el objetivo principal es identificar las dimensiones latentes o las construcciones representadas en las variables originales y el investigador tiene poco conocimiento acerca de la varianza específica y error y por tanto quiere eliminar esta varianza, lo más apropiado es utilizar el modelo factorial común'."
            },
            {
                "id": 9,
                "pregunta": "Según el texto, ¿en qué condiciones los resultados del análisis de componentes principales y del análisis factorial común tienden a ser esencialmente idénticos?",
                "opciones": {
                    "a": "Cuando el número de variables excede de 30 o las comunalidades superan 0.60 para la mayoría",
                    "b": "Siempre, porque son intercambiables",
                    "c": "Solo cuando la muestra es superior a 500 casos",
                    "d": "Nunca, siempre dan resultados diferentes"
                },
                "respuesta_correcta": "a",
                "explicacion": "El texto afirma: 'En la mayoría de las aplicaciones, tanto el análisis de componentes principales como los análisis factoriales comunes llegan a resultados esencialmente idénticos si el número de variables excede de 30, o las varianzas compartidas exceden de 0,60 para la mayoría de las variables'."
            },
            {
                "id": 10,
                "pregunta": "¿Cuál es el criterio de raíz latente (autovalor) para decidir el número de factores a extraer?",
                "opciones": {
                    "a": "Extraer solo factores con autovalor mayor que 2",
                    "b": "Extraer factores con autovalor mayor que 1 (explican al menos una variable)",
                    "c": "Extraer todos los factores con autovalor positivo",
                    "d": "Extraer factores hasta que la suma de autovalores supere 0.95"
                },
                "respuesta_correcta": "b",
                "explicacion": "El texto indica: 'solo se consideran los factores que tienen raíces latentes o autovalores mayores que 1; explican al menos una variable...'"
            },
            {
                "id": 11,
                "pregunta": "Según el texto, el criterio de raíz latente (autovalor > 1) es más fiable cuando el número de variables está entre:",
                "opciones": {
                    "a": "5 y 15",
                    "b": "20 y 50",
                    "c": "50 y 100",
                    "d": "100 y 200"
                },
                "respuesta_correcta": "b",
                "explicacion": "El texto señala: 'El uso del autovalor para establecer un corte es más fiable cuando el número de variables está entre 20 y 50'."
            },
            {
                "id": 12,
                "pregunta": "¿Qué indica la prueba de caída (scree plot) en relación con el criterio de autovalor > 1?",
                "opciones": {
                    "a": "Generalmente sugiere extraer menos factores",
                    "b": "Normalmente sugiere incluir uno o dos factores adicionales más que el criterio de autovalor > 1",
                    "c": "Siempre coincide exactamente con el criterio de autovalor",
                    "d": "Es menos fiable que el criterio de autovalor"
                },
                "respuesta_correcta": "b",
                "explicacion": "El texto dice: 'Por regla general, el contraste de caída normalmente tiene como resultado que se incluyan uno y a veces dos o más factores adicionales que cuando se utiliza el criterio de raíz latente'."
            },
            {
                "id": 13,
                "pregunta": "¿Qué porcentaje de varianza total se considera aceptable en ciencias sociales para una solución factorial?",
                "opciones": {
                    "a": "95% o más",
                    "b": "80% o más",
                    "c": "60% (y en algunos casos incluso menos)",
                    "d": "Solo si supera el 75%"
                },
                "respuesta_correcta": "c",
                "explicacion": "El texto indica: 'en las ciencias sociales, donde la información muchas veces es menos precisa, es normal considerar una solución que represente un 60 por ciento de la varianza total (y en algunos casos incluso menos) como satisfactoria'."
            },
            {
                "id": 14,
                "pregunta": "¿Qué ocurre si se mezclan variables dependientes e independientes en un mismo análisis factorial?",
                "opciones": {
                    "a": "El análisis factorial automáticamente las separa",
                    "b": "Es inapropiado, según los supuestos conceptuales",
                    "c": "Mejora la varianza explicada",
                    "d": "Solo es un problema si la muestra es pequeña"
                },
                "respuesta_correcta": "b",
                "explicacion": "El texto advierte: 'la mezcla de variables dependientes e independientes en un solo análisis factorial y posteriormente el uso de los factores derivados para apoyar las relaciones de dependencia es inapropiado'."
            },
            {
                "id": 15,
                "pregunta": "Si se esperan grupos diferentes en la muestra (ej. hombres y mujeres con opiniones distintas), ¿qué recomienda el texto?",
                "opciones": {
                    "a": "Ignorar las diferencias y analizar la muestra completa",
                    "b": "Realizar análisis factoriales separados y comparar resultados",
                    "c": "Usar solo análisis de componentes principales",
                    "d": "Aumentar el tamaño muestral para diluir las diferencias"
                },
                "respuesta_correcta": "b",
                "explicacion": "El texto indica: 'cuando se esperan grupos diferentes en la muestra, se deben practicar análisis factoriales separados y los resultados deben ser comparados para identificar las diferencias'."
            }
        ];

        let preguntaActual = 0;
        let respuestas = new Array(preguntas.length).fill(null);
        let cuestionarioFinalizado = false;

        function inicializarCuestionario() {
            const contenedor = document.getElementById('contenedor-preguntas');
            contenedor.innerHTML = '';

            preguntas.forEach((p, index) => {
                const div = document.createElement('div');
                div.className = 'pregunta-container';
                if (index === 0) div.classList.add('activa');
                div.id = 'pregunta-' + index;

                let opcionesHTML = '';
                const letras = ['a', 'b', 'c', 'd'];
                for (let letra of letras) {
                    opcionesHTML += `
                        <div class="opcion" id="opcion-${index}-${letra}" onclick="seleccionarRespuesta(${index}, '${letra}')">
                            <div class="letra-opcion">${letra.toUpperCase()}</div>
                            <div class="texto-opcion">${p.opciones[letra]}</div>
                        </div>
                    `;
                }

                div.innerHTML = `
                    <div class="numero-pregunta">PREGUNTA ${p.id}</div>
                    <div class="texto-pregunta">${p.pregunta}</div>
                    <div class="opciones">
                        ${opcionesHTML}
                    </div>
                    <div class="explicacion" id="explicacion-${index}">
                        <strong>💡 Explicación:</strong> ${p.explicacion}
                    </div>
                `;

                contenedor.appendChild(div);
            });

            actualizarNavegacion();
        }

        function seleccionarRespuesta(index, letra) {
            if (cuestionarioFinalizado) return;

            if (respuestas[index] !== null) return;

            respuestas[index] = letra;
            const pregunta = preguntas[index];

            const letras = ['a', 'b', 'c', 'd'];
            letras.forEach(l => {
                const opcion = document.getElementById('opcion-' + index + '-' + l);
                if (opcion) {
                    opcion.style.pointerEvents = 'none';
                    if (l === pregunta.respuesta_correcta) {
                        opcion.classList.add('correcta');
                    }
                }
            });

            const opcionUsuario = document.getElementById('opcion-' + index + '-' + letra);
            if (opcionUsuario) {
                opcionUsuario.classList.add('seleccionada');
                if (letra !== pregunta.respuesta_correcta) {
                    opcionUsuario.classList.add('incorrecta');
                }
            }

            const explicacion = document.getElementById('explicacion-' + index);
            if (explicacion) {
                explicacion.classList.add('visible');
            }
        }

        function mostrarPregunta(index) {
            document.querySelectorAll('.pregunta-container').forEach(p => p.classList.remove('activa'));
            const preguntaDiv = document.getElementById('pregunta-' + index);
            if (preguntaDiv) {
                preguntaDiv.classList.add('activa');
            }

            document.getElementById('texto-progreso').textContent = 'Pregunta ' + (index + 1) + ' de ' + preguntas.length;
            document.getElementById('barra-progreso').style.width = ((index + 1) / preguntas.length * 100) + '%';

            actualizarNavegacion();
        }

        function actualizarNavegacion() {
            document.getElementById('btn-anterior').disabled = preguntaActual === 0;

            if (preguntaActual === preguntas.length - 1) {
                document.getElementById('btn-siguiente').textContent = '✅ Finalizar';
            } else {
                document.getElementById('btn-siguiente').textContent = 'Siguiente ▶';
            }
        }

        function preguntaSiguiente() {
            if (preguntaActual === preguntas.length - 1) {
                finalizarCuestionario();
                return;
            }

            if (preguntaActual < preguntas.length - 1) {
                preguntaActual++;
                mostrarPregunta(preguntaActual);
            }
        }

        function preguntaAnterior() {
            if (preguntaActual > 0) {
                preguntaActual--;
                mostrarPregunta(preguntaActual);
            }
        }

        function finalizarCuestionario() {
            cuestionarioFinalizado = true;

            let aciertos = 0;
            preguntas.forEach((p, index) => {
                if (respuestas[index] === p.respuesta_correcta) {
                    aciertos++;
                }
            });

            document.getElementById('zona-cuestionario').style.display = 'none';
            document.getElementById('resultado-container').classList.add('visible');
            document.getElementById('puntaje-final').textContent = aciertos + '/' + preguntas.length;

            const porcentaje = (aciertos / preguntas.length) * 100;
            const mensaje = document.getElementById('mensaje-final');

            if (porcentaje >= 90) {
                mensaje.innerHTML = '🌟 <strong>¡Excelente!</strong><br>Dominas perfectamente los conceptos de análisis factorial.';
            } else if (porcentaje >= 70) {
                mensaje.innerHTML = '👍 <strong>¡Buen trabajo!</strong><br>Tienes una buena comprensión. Repasa las preguntas que fallaste.';
            } else if (porcentaje >= 50) {
                mensaje.innerHTML = '📚 <strong>Vas por buen camino.</strong><br>Necesitas repasar con más profundidad el material.';
            } else {
                mensaje.innerHTML = '📖 <strong>Es hora de estudiar más.</strong><br>Revisa con detenimiento el resumen y vuelve a intentarlo.';
            }
        }

        function reiniciarCuestionario() {
            preguntaActual = 0;
            respuestas = new Array(preguntas.length).fill(null);
            cuestionarioFinalizado = false;

            document.getElementById('zona-cuestionario').style.display = 'block';
            document.getElementById('resultado-container').classList.remove('visible');

            inicializarCuestionario();
            mostrarPregunta(0);
        }

        inicializarCuestionario();
    </script>
</body>
</html>
