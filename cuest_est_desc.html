<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuestionario - Estadística Descriptiva</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 25px;
            padding: 35px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        h1 {
            text-align: center;
            color: #f0f0f0;
            margin-bottom: 8px;
            font-size: 1.8em;
            letter-spacing: 1px;
        }

        .subtitulo {
            text-align: center;
            color: #a0c0c0;
            margin-bottom: 30px;
            font-size: 0.95em;
            font-weight: 300;
        }

        .progreso {
            text-align: center;
            margin-bottom: 15px;
            font-size: 1.05em;
            color: #c0e0e0;
            font-weight: 500;
        }

        .barra-progreso {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .barra-progreso-interna {
            height: 100%;
            background: linear-gradient(90deg, #2ecc71, #27ae60);
            border-radius: 3px;
            transition: width 0.5s ease;
        }

        .pregunta-container {
            display: none;
            animation: fadeSlideIn 0.45s ease;
        }

        .pregunta-container.activa {
            display: block;
        }

        @keyframes fadeSlideIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .numero-pregunta {
            color: #2ecc71;
            font-weight: 700;
            font-size: 1em;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .texto-pregunta {
            background: rgba(46, 204, 113, 0.08);
            border-left: 5px solid #2ecc71;
            padding: 18px 22px;
            border-radius: 10px;
            margin-bottom: 25px;
            font-size: 1.15em;
            line-height: 1.6;
            color: #e8f0e8;
        }

        .opciones {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .opcion {
            background: rgba(255, 255, 255, 0.04);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 14px 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 14px;
            color: #d0e0d0;
        }

        .opcion:hover {
            background: rgba(46, 204, 113, 0.12);
            border-color: rgba(46, 204, 113, 0.5);
            transform: translateX(6px);
        }

        .opcion.seleccionada {
            background: rgba(46, 204, 113, 0.2);
            border-color: #2ecc71;
            box-shadow: 0 0 18px rgba(46, 204, 113, 0.25);
        }

        .opcion.correcta {
            background: rgba(46, 204, 113, 0.25) !important;
            border-color: #2ecc71 !important;
            box-shadow: 0 0 18px rgba(46, 204, 113, 0.2) !important;
        }

        .opcion.incorrecta {
            background: rgba(231, 76, 60, 0.25) !important;
            border-color: #e74c3c !important;
            box-shadow: 0 0 18px rgba(231, 76, 60, 0.2) !important;
        }

        .letra-opcion {
            background: rgba(46, 204, 113, 0.25);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.1em;
            flex-shrink: 0;
            color: #c0e0c0;
        }

        .texto-opcion {
            flex: 1;
            font-size: 1.02em;
        }

        .explicacion {
            display: none;
            margin-top: 20px;
            padding: 16px 20px;
            background: rgba(241, 196, 15, 0.08);
            border-left: 4px solid #f1c40f;
            border-radius: 8px;
            line-height: 1.6;
            color: #e8e0b0;
        }

        .explicacion.visible {
            display: block;
            animation: fadeSlideIn 0.35s ease;
        }

        .botones {
            display: flex;
            justify-content: space-between;
            margin-top: 35px;
            flex-wrap: wrap;
            gap: 10px;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            font-size: 0.95em;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .btn-anterior {
            background: rgba(255, 255, 255, 0.06);
            color: #d0e0d0;
            border: 2px solid rgba(255, 255, 255, 0.15);
        }

        .btn-anterior:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        .btn-siguiente {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: white;
        }

        .btn-siguiente:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(46, 204, 113, 0.4);
        }

        .btn-reiniciar {
            background: transparent;
            color: #f1c40f;
            border: 2px solid #f1c40f;
        }

        .btn-reiniciar:hover {
            background: rgba(241, 196, 15, 0.08);
        }

        .resultado-container {
            display: none;
            text-align: center;
            padding: 25px;
        }

        .resultado-container.visible {
            display: block;
            animation: fadeSlideIn 0.55s ease;
        }

        .puntaje {
            font-size: 4.5em;
            font-weight: 700;
            color: #f1c40f;
            margin: 25px 0;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
        }

        .mensaje-final {
            font-size: 1.2em;
            margin-bottom: 30px;
            line-height: 1.7;
            color: #d0e0d0;
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            pointer-events: none;
        }

        @media (max-width: 600px) {
            .container {
                padding: 22px 15px;
                border-radius: 18px;
            }
            h1 {
                font-size: 1.35em;
            }
            .texto-pregunta {
                font-size: 1em;
                padding: 14px 16px;
            }
            button {
                padding: 10px 16px;
                font-size: 0.88em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Cuestionario de Estadística Descriptiva</h1>
        <p class="subtitulo">Distribución de frecuencias · Gráficas · Medidas de Tendencia Central, Posición y Dispersión · Excel</p>

        <div id="zona-cuestionario">
            <div class="progreso" id="texto-progreso">Pregunta 1 de 12</div>
            <div class="barra-progreso">
                <div class="barra-progreso-interna" id="barra-progreso" style="width: 8.33%;"></div>
            </div>
            <div id="contenedor-preguntas"></div>
            <div class="botones" id="botones-navegacion">
                <button class="btn-anterior" id="btn-anterior" onclick="preguntaAnterior()">◀ Anterior</button>
                <button class="btn-reiniciar" onclick="reiniciarCuestionario()">🔄 Reiniciar</button>
                <button class="btn-siguiente" id="btn-siguiente" onclick="preguntaSiguiente()">Siguiente ▶</button>
            </div>
        </div>

        <div class="resultado-container" id="resultado-container">
            <h2 style="color: #f0f0f0;">🎉 ¡Cuestionario Completado!</h2>
            <div class="puntaje" id="puntaje-final">0/12</div>
            <p class="mensaje-final" id="mensaje-final"></p>
            <button class="btn-reiniciar" onclick="reiniciarCuestionario()">🔄 Volver a Intentar</button>
        </div>
    </div>

    <script>
        const preguntas = [
            {
                "id": 1,
                "pregunta": "Según el resumen, ¿cuál de las siguientes NO es una medida de tendencia central?",
                "opciones": {
                    "a": "Media aritmética",
                    "b": "Mediana",
                    "c": "Rango intercuartil",
                    "d": "Moda"
                },
                "respuesta_correcta": "c",
                "explicacion": "El rango intercuartil (RIC = Q3 - Q1) es una medida de DISPERSIÓN, no de tendencia central. Las medidas de tendencia central son media, mediana y moda."
            },
            {
                "id": 2,
                "pregunta": "Para una variable cualitativa, ¿qué tipo de gráfica es la más apropiada según el resumen?",
                "opciones": {
                    "a": "Histograma",
                    "b": "Polígono de frecuencias",
                    "c": "Diagrama de barras o diagrama circular",
                    "d": "Ojiva"
                },
                "respuesta_correcta": "c",
                "explicacion": "El resumen indica que para variables cualitativas se recomienda usar diagrama de barras o diagrama circular. El histograma, polígono y ojiva son para variables cuantitativas continuas."
            },
            {
                "id": 3,
                "pregunta": "¿Qué fórmula se utiliza para calcular la mediana (Me) en datos agrupados en intervalos?",
                "opciones": {
                    "a": "Me = l_i + [(n/2 - N_{i-1}) / n_i] * c",
                    "b": "Me = l_i + [(k*n/4 - N_{i-1}) / n_i] * c",
                    "c": "Me = (Σ x_i * n_i) / n",
                    "d": "Me = l_i + [Δ_1 / (Δ_1 + Δ_2)] * c"
                },
                "respuesta_correcta": "a",
                "explicacion": "La fórmula correcta para la mediana en datos agrupados es Me = l_i + [(n/2 - N_{i-1}) / n_i] * c, donde n es el total de datos, l_i es el límite inferior del intervalo que contiene n/2, N_{i-1} es la frecuencia acumulada anterior, n_i la frecuencia del intervalo y c la amplitud."
            },
            {
                "id": 4,
                "pregunta": "Si una distribución de datos tiene una curtosis menor a cero, ¿cómo se clasifica?",
                "opciones": {
                    "a": "Mesocúrtica",
                    "b": "Leptocúrtica",
                    "c": "Platicúrtica",
                    "d": "Simétrica"
                },
                "respuesta_correcta": "c",
                "explicacion": "Según el resumen: curtosis > 0 es leptocúrtica (puntiaguda), curtosis = 0 es mesocúrtica (normal), curtosis < 0 es platicúrtica (aplanada, baja concentración alrededor de la media)."
            },
            {
                "id": 5,
                "pregunta": "¿Qué mide el coeficiente de variación (CV) y para qué sirve?",
                "opciones": {
                    "a": "Mide la tendencia central y sirve para calcular la moda",
                    "b": "Mide la dispersión relativa y sirve para comparar variabilidad entre conjuntos con unidades diferentes",
                    "c": "Mide la forma de la distribución y sirve para detectar sesgo",
                    "d": "Mide la posición de los datos y sirve para calcular percentiles"
                },
                "respuesta_correcta": "b",
                "explicacion": "El CV = (s / x̄) * 100 expresa la desviación estándar como porcentaje de la media. Es una medida de dispersión RELATIVA que permite comparar la variabilidad de distintos conjuntos de datos, incluso si tienen unidades de medida diferentes."
            },
            {
                "id": 6,
                "pregunta": "¿Cuál es el primer paso para activar la herramienta 'Análisis de datos' en Microsoft Excel?",
                "opciones": {
                    "a": "Seleccionar la pestaña Datos y luego Análisis de datos",
                    "b": "Ir a Archivo > Opciones > Complementos",
                    "c": "Instalar un complemento desde la tienda de Microsoft",
                    "d": "Reiniciar Excel después de guardar el archivo"
                },
                "respuesta_correcta": "b",
                "explicacion": "El procedimiento indicado en el resumen es: Archivo > Opciones > Complementos. Luego, en 'Administrar' seleccionar 'Complementos de Excel', hacer clic en 'Ir...', marcar 'Herramientas para análisis' y Aceptar."
            },
            {
                "id": 7,
                "pregunta": "Si el 50% de los datos están entre Q1 = 159.4 cm y Q3 = 166 cm, ¿cuál es el rango intercuartil (RIC)?",
                "opciones": {
                    "a": "325.4 cm",
                    "b": "6.6 cm",
                    "c": "25 cm",
                    "d": "166 cm"
                },
                "respuesta_correcta": "b",
                "explicacion": "El rango intercuartil se calcula como RIC = Q3 - Q1 = 166 - 159.4 = 6.6 cm. Esta medida representa la dispersión del 50% central de los datos."
            },
            {
                "id": 8,
                "pregunta": "Según el resumen, ¿cómo se clasifica una estimación con un coeficiente de variación (CV) del 25%?",
                "opciones": {
                    "a": "Precisión precisa",
                    "b": "Precisión aceptable",
                    "c": "Precisión regular",
                    "d": "Poco precisa"
                },
                "respuesta_correcta": "d",
                "explicacion": "Según el criterio del DANE: CV ≤ 7%: precisa; 8-14%: aceptable; 15-20%: regular; CV > 20%: poco precisa. Por lo tanto, 25% es poco precisa."
            },
            {
                "id": 9,
                "pregunta": "En una tabla de distribución de frecuencias, ¿qué representa la frecuencia relativa acumulada (H_i) en el último intervalo?",
                "opciones": {
                    "a": "0%",
                    "b": "50%",
                    "c": "75%",
                    "d": "100%"
                },
                "respuesta_correcta": "d",
                "explicacion": "La frecuencia relativa acumulada (H_i) es la suma de las frecuencias relativas hasta un valor i. En el último intervalo, la suma de todos los porcentajes debe ser igual al 100%."
            },
            {
                "id": 10,
                "pregunta": "¿Qué medida de posición divide los datos en 100 partes iguales?",
                "opciones": {
                    "a": "Cuartiles",
                    "b": "Deciles",
                    "c": "Percentiles",
                    "d": "Quintiles"
                },
                "respuesta_correcta": "c",
                "explicacion": "Los percentiles (P_k) dividen la distribución en 100 partes iguales (1% cada una). Existen 99 percentiles. Los cuartiles dividen en 4 partes (25%), los deciles en 10 partes (10%)."
            },
            {
                "id": 11,
                "pregunta": "En un histograma de frecuencias absolutas, ¿qué representan la base y la altura de los rectángulos respectivamente?",
                "opciones": {
                    "a": "La base es la frecuencia y la altura es el intervalo",
                    "b": "La base es la marca de clase y la altura es la frecuencia relativa",
                    "c": "La base es la amplitud del intervalo y la altura es la frecuencia",
                    "d": "La base es el límite superior y la altura es el límite inferior"
                },
                "respuesta_correcta": "c",
                "explicacion": "En el histograma, la base de cada rectángulo está determinada por la amplitud del intervalo, y la altura corresponde a la frecuencia (absoluta o relativa) que presenta cada intervalo."
            },
            {
                "id": 12,
                "pregunta": "¿Cuál es la diferencia entre la varianza muestral (s²) y la varianza poblacional (σ²) en sus denominadores?",
                "opciones": {
                    "a": "s² se divide por n, σ² se divide por n-1",
                    "b": "s² se divide por n-1, σ² se divide por N",
                    "c": "Ambas se dividen por n",
                    "d": "s² se divide por N, σ² se divide por n-1"
                },
                "respuesta_correcta": "b",
                "explicacion": "La varianza poblacional σ² = Σ(x_i - μ)² / N. La varianza muestral s² = Σ(x_i - x̄)² / (n-1). Se usa (n-1) para que s² sea un estimador insesgado de la varianza poblacional."
            }
        ];

        let preguntaActual = 0;
        let respuestas = new Array(preguntas.length).fill(null);
        let cuestionarioFinalizado = false;

        function inicializarCuestionario() {
            const contenedor = document.getElementById('contenedor-preguntas');
            contenedor.innerHTML = '';

            preguntas.forEach((p, index) => {
                const div = document.createElement('div');
                div.className = 'pregunta-container';
                if (index === 0) div.classList.add('activa');
                div.id = 'pregunta-' + index;

                let opcionesHTML = '';
                const letras = ['a', 'b', 'c', 'd'];
                for (let letra of letras) {
                    opcionesHTML += `
                        <div class="opcion" id="opcion-${index}-${letra}" onclick="seleccionarRespuesta(${index}, '${letra}')">
                            <div class="letra-opcion">${letra.toUpperCase()}</div>
                            <div class="texto-opcion">${p.opciones[letra]}</div>
                        </div>
                    `;
                }

                div.innerHTML = `
                    <div class="numero-pregunta">PREGUNTA ${p.id}</div>
                    <div class="texto-pregunta">${p.pregunta}</div>
                    <div class="opciones">
                        ${opcionesHTML}
                    </div>
                    <div class="explicacion" id="explicacion-${index}">
                        <strong>💡 Explicación:</strong> ${p.explicacion}
                    </div>
                `;

                contenedor.appendChild(div);
            });

            actualizarNavegacion();
        }

        function seleccionarRespuesta(index, letra) {
            if (cuestionarioFinalizado) return;

            if (respuestas[index] !== null) return;

            respuestas[index] = letra;
            const pregunta = preguntas[index];

            const letras = ['a', 'b', 'c', 'd'];
            letras.forEach(l => {
                const opcion = document.getElementById('opcion-' + index + '-' + l);
                if (opcion) {
                    opcion.style.pointerEvents = 'none';
                    if (l === pregunta.respuesta_correcta) {
                        opcion.classList.add('correcta');
                    }
                }
            });

            const opcionUsuario = document.getElementById('opcion-' + index + '-' + letra);
            if (opcionUsuario) {
                opcionUsuario.classList.add('seleccionada');
                if (letra !== pregunta.respuesta_correcta) {
                    opcionUsuario.classList.add('incorrecta');
                }
            }

            const explicacion = document.getElementById('explicacion-' + index);
            if (explicacion) {
                explicacion.classList.add('visible');
            }
        }

        function mostrarPregunta(index) {
            document.querySelectorAll('.pregunta-container').forEach(p => p.classList.remove('activa'));
            const preguntaDiv = document.getElementById('pregunta-' + index);
            if (preguntaDiv) {
                preguntaDiv.classList.add('activa');
            }

            document.getElementById('texto-progreso').textContent = 'Pregunta ' + (index + 1) + ' de ' + preguntas.length;
            document.getElementById('barra-progreso').style.width = ((index + 1) / preguntas.length * 100) + '%';

            actualizarNavegacion();
        }

        function actualizarNavegacion() {
            document.getElementById('btn-anterior').disabled = preguntaActual === 0;

            if (preguntaActual === preguntas.length - 1) {
                document.getElementById('btn-siguiente').textContent = '✅ Finalizar';
            } else {
                document.getElementById('btn-siguiente').textContent = 'Siguiente ▶';
            }
        }

        function preguntaSiguiente() {
            if (preguntaActual === preguntas.length - 1) {
                finalizarCuestionario();
                return;
            }

            if (preguntaActual < preguntas.length - 1) {
                preguntaActual++;
                mostrarPregunta(preguntaActual);
            }
        }

        function preguntaAnterior() {
            if (preguntaActual > 0) {
                preguntaActual--;
                mostrarPregunta(preguntaActual);
            }
        }

        function finalizarCuestionario() {
            cuestionarioFinalizado = true;

            let aciertos = 0;
            preguntas.forEach((p, index) => {
                if (respuestas[index] === p.respuesta_correcta) {
                    aciertos++;
                }
            });

            document.getElementById('zona-cuestionario').style.display = 'none';
            document.getElementById('resultado-container').classList.add('visible');
            document.getElementById('puntaje-final').textContent = aciertos + '/' + preguntas.length;

            const porcentaje = (aciertos / preguntas.length) * 100;
            const mensaje = document.getElementById('mensaje-final');

            if (porcentaje >= 90) {
                mensaje.innerHTML = '🌟 <strong>¡Excelente!</strong><br>Dominas perfectamente los conceptos de estadística descriptiva.';
            } else if (porcentaje >= 70) {
                mensaje.innerHTML = '👍 <strong>¡Buen trabajo!</strong><br>Tienes una buena comprensión, pero repasa las preguntas que fallaste.';
            } else if (porcentaje >= 50) {
                mensaje.innerHTML = '📚 <strong>Vas por buen camino.</strong><br>Necesitas repasar con más profundidad el resumen.';
            } else {
                mensaje.innerHTML = '📖 <strong>Es hora de estudiar más.</strong><br>Revisa con detenimiento el resumen y vuelve a intentarlo.';
            }
        }

        function reiniciarCuestionario() {
            preguntaActual = 0;
            respuestas = new Array(preguntas.length).fill(null);
            cuestionarioFinalizado = false;

            document.getElementById('zona-cuestionario').style.display = 'block';
            document.getElementById('resultado-container').classList.remove('visible');

            inicializarCuestionario();
            mostrarPregunta(0);
        }

        inicializarCuestionario();
    </script>
</body>
</html>
